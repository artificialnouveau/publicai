<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sovereign AI Consortium — Decision Tree</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1b2a;--accent:#2d7dd2;--border:#e5e7eb;--bg:#f8f9fa;
  --white:#fff;--text:#1a1a1a;--muted:#6b7280;--radius:6px;
  --shadow:0 2px 8px rgba(0,0,0,.1);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);height:100vh;
  display:flex;flex-direction:column;overflow:hidden}
/* ── header ── */
#header{background:var(--navy);color:#fff;padding:0 20px;height:52px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.3)}
.logo{font-weight:800;font-size:11px;letter-spacing:1px;background:var(--accent);
  padding:3px 7px;border-radius:3px;margin-right:10px}
#header h1{font-size:15px;font-weight:600}
#header .sub{font-size:11px;color:#94a3b8;margin-left:8px}
.hdr-links a{color:#94a3b8;font-size:12px;padding:4px 8px;border-radius:4px;
  text-decoration:none;transition:background .15s}
.hdr-links a:hover{background:rgba(255,255,255,.1);color:#fff}
/* ── toolbar ── */
#toolbar{background:var(--white);border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  flex-wrap:wrap}
.pill{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:500;
  cursor:pointer;border:1.5px solid transparent;transition:all .15s;background:transparent;
  color:var(--muted)}
.pill:hover{background:var(--bg)}
.pill.active{color:#fff;border-color:transparent}
.sep{width:1px;height:20px;background:var(--border)}
#search-input{border:1.5px solid var(--border);border-radius:20px;padding:4px 12px;
  font-size:12px;width:200px;outline:none;transition:border-color .15s}
#search-input:focus{border-color:var(--accent)}
.view-btn{background:transparent;border:1.5px solid var(--border);border-radius:4px;
  padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted);transition:all .15s}
.view-btn.active,.view-btn:hover{border-color:var(--accent);color:var(--accent)}
/* ── main area ── */
#main{flex:1;display:flex;overflow:hidden}
/* Graph panel */
#graph-panel{flex:1;position:relative}
#network{width:100%;height:100%}
/* Detail panel */
#detail-panel{width:380px;border-left:1px solid var(--border);background:var(--white);
  overflow-y:auto;flex-shrink:0;transition:transform .2s}
#detail-panel.hidden{transform:translateX(100%);width:0;border:none}
#detail-close{position:absolute;top:12px;right:12px;background:none;border:none;
  font-size:20px;color:var(--muted);cursor:pointer;z-index:10}
#detail-content{padding:20px}
.detail-branch-id{font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.detail-question{font-size:17px;font-weight:700;color:var(--navy);
  line-height:1.4;margin-bottom:6px}
.detail-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.detail-section-title{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.option-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:8px}
.option-label{font-weight:700;color:var(--navy);font-size:13px;margin-bottom:4px}
.option-means{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:4px}
.option-trades{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:6px;
  font-style:italic}
.leads-wrap{display:flex;flex-wrap:wrap;gap:4px}
.node-chip{background:#e8f0fe;color:#1a56db;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.node-chip:hover{background:#c7d7fc}
/* List view */
#list-panel{flex:1;overflow-y:auto;padding:20px;display:none}
#list-panel.active{display:block}
.branch-block{background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
.branch-hdr{padding:14px 18px;display:flex;align-items:center;gap:10px;cursor:pointer}
.branch-hdr-id{font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:#fff;padding:2px 8px;border-radius:3px}
.branch-hdr-name{font-size:15px;font-weight:600;color:var(--navy)}
.branch-hdr-arrow{margin-left:auto;color:var(--muted);font-size:16px;transition:transform .2s}
.branch-hdr.open .branch-hdr-arrow{transform:rotate(90deg)}
.branch-body{display:none;padding:0 18px 16px}
.branch-body.open{display:block}
.branch-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.node-row{border-top:1px solid var(--border);padding:12px 0}
.node-row-q{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:3px}
.node-row-d{font-size:12px;color:var(--muted);margin-bottom:8px}
table.opt-tbl{width:100%;border-collapse:collapse;font-size:12px}
.opt-tbl th{background:var(--navy);color:#fff;padding:6px 10px;text-align:left;font-size:11px}
.opt-tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.opt-tbl tr:last-child td{border-bottom:none}
.opt-tbl tr:hover td{background:#f0f4f8}
.cp-section{background:var(--white);border:1px solid var(--border);
  border-left:4px solid var(--accent);border-radius:var(--radius);
  padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.cp-section h2{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:6px}
.cp-section p{font-size:13px;color:var(--muted);margin-bottom:14px}
.cp-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cp-item:last-child{border-bottom:none}
.cp-num{background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px}
.cp-nid{font-weight:700;color:var(--navy);margin-right:4px}
.cp-title{font-weight:600}
.cp-desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
/* Legend */
#legend{position:absolute;bottom:16px;left:16px;background:rgba(255,255,255,.95);
  border:1px solid var(--border);border-radius:6px;padding:10px 14px;
  font-size:11px;box-shadow:var(--shadow);z-index:5}
#legend h4{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
/* Tooltip */
#tooltip{position:absolute;background:rgba(13,27,42,.9);color:#fff;
  padding:8px 12px;border-radius:6px;font-size:12px;pointer-events:none;
  max-width:260px;line-height:1.5;z-index:50;display:none}
</style>
</head>

  <div style="display:flex;align-items:center">

  <div class="hdr-links">

<script>
// ── data ──────────────────────────────────────────────────────────────────
const BRANCHES    = [{"id": "A", "name": "Political and Governance", "description": "Who owns the consortium, who decides, and how it positions itself in the world. Every other branch inherits these answers."}, {"id": "B", "name": "Product and Technology", "description": "What you actually build, how open it is, and who it serves. Constrained by Branch A governance and Branch C compute reality."}, {"id": "C", "name": "Compute and Infrastructure", "description": "The physical foundation. Without resolved compute, energy, and chip access, the product branch cannot deliver. This is where sovereignty is most often won or lost."}, {"id": "D", "name": "Funding and Economic Model", "description": "Where the money comes from, how the consortium sustains itself, and who owns the value created. Funding choices follow control choices in Branch A."}, {"id": "E", "name": "Talent and Research", "description": "People are scarcer than chips. How the consortium attracts, organizes, and retains researchers shapes whether the build succeeds."}, {"id": "F", "name": "Security, Safety, and Compliance", "description": "How the consortium prevents misuse, secures its systems, and proves it is trustworthy to members and the public."}, {"id": "G", "name": "Legal, Ethical, and Data Sovereignty", "description": "Where data lives, whose rights govern it, and who is liable when things go wrong. These choices underpin public trust and legal durability."}, {"id": "H", "name": "Outcomes and Real-World Players", "description": "What consortium model does each path actually produce, and who are the real entities shaping this landscape now? Context from current geopolitics and the sovereign AI debate."}];
const NODES       = [{"id": "A1", "branch_id": "A", "question": "Who holds sovereign control?", "description": "Pick the ownership and authority model. This defines the legal home, the chain of command, and who can veto."}, {"id": "A2", "branch_id": "A", "question": "How are decisions made among members?", "description": "Choose the governance mechanism that resolves disputes and sets strategy."}, {"id": "A3", "branch_id": "A", "question": "What is the geopolitical posture?", "description": "Decide how the consortium relates to existing technology blocs and rivals."}, {"id": "A4", "branch_id": "A", "question": "What is the regulatory stance?", "description": "Set the rule baseline the consortium will hold itself to across members."}, {"id": "B1", "branch_id": "B", "question": "Build, adapt, or license the foundation model?", "description": "The single most expensive technical choice. It sets your compute bill, your timeline, and your independence."}, {"id": "B2", "branch_id": "B", "question": "Open or closed weights for what you build?", "description": "Decide how widely the resulting models can be inspected, reused, and redistributed."}, {"id": "B3", "branch_id": "B", "question": "What is the product focus?", "description": "Choose where the consortium concentrates effort first. Trying to do everything dilutes a young program."}, {"id": "B4", "branch_id": "B", "question": "What is the language and cultural scope?", "description": "Sovereign programs often justify themselves on serving local languages and values. Decide the reach."}, {"id": "C1", "branch_id": "C", "question": "Where does compute live?", "description": "Decide the hosting model for training and serving. This is the core of technical sovereignty."}, {"id": "C2", "branch_id": "C", "question": "How is chip supply secured?", "description": "Access to advanced accelerators is the chief chokepoint. Resolve it before committing to training scope."}, {"id": "C3", "branch_id": "C", "question": "What is the energy strategy?", "description": "Large clusters need stable, affordable power. Site and source decisions shape cost and emissions."}, {"id": "D1", "branch_id": "D", "question": "What is the capital source?", "description": "Decide who funds the build and on what terms. This drives expectations on returns and control."}, {"id": "D2", "branch_id": "D", "question": "What is the revenue model?", "description": "Choose how, or whether, the consortium earns income to sustain itself."}, {"id": "D3", "branch_id": "D", "question": "Who owns the intellectual property?", "description": "Decide where models, data assets, and tooling legally sit. This often becomes the hardest negotiation."}, {"id": "E1", "branch_id": "E", "question": "How is talent sourced?", "description": "Decide where the core research and engineering team comes from."}, {"id": "E2", "branch_id": "E", "question": "How is research organized?", "description": "Choose the structure that balances focus with member participation."}, {"id": "F1", "branch_id": "F", "question": "How is safety governed?", "description": "Decide who sets and enforces safety standards for the models and products."}, {"id": "F2", "branch_id": "F", "question": "How is access and export controlled?", "description": "Decide who can use the models and how distribution is restricted."}, {"id": "F3", "branch_id": "F", "question": "How are incidents and misuse handled?", "description": "Decide the response model for security breaches and harmful use."}, {"id": "G1", "branch_id": "G", "question": "What is the data residency rule?", "description": "Decide where training and user data is stored and processed."}, {"id": "G2", "branch_id": "G", "question": "What rights and consent framework applies?", "description": "Decide the legal basis for using personal and public data and protecting individuals."}, {"id": "G3", "branch_id": "G", "question": "Who bears liability?", "description": "Decide where legal and financial responsibility rests when systems cause harm."}, {"id": "H1", "branch_id": "H", "question": "What consortium model does this path produce?", "description": "Different combinations of A-G choices converge on recognizable institutional archetypes."}, {"id": "H2", "branch_id": "H", "question": "Which existing European and allied AI players are in scope?", "description": "The coalition does not start from zero. Existing labs, research groups, and industrial champions can be absorbed or partnered."}, {"id": "H3", "branch_id": "H", "question": "What chip and infrastructure players must be negotiated with?", "description": "Compute sovereignty depends on a small number of critical hardware suppliers, cloud providers, and semiconductor tool makers."}, {"id": "H4", "branch_id": "H", "question": "What U.S. model providers are negotiating partners or risks?", "description": "Before a sovereign model exists, the consortium will rely on or resist U.S. frontier models."}, {"id": "H5", "branch_id": "H", "question": "What geopolitical triggers accelerate or kill the project?", "description": "The \"Fable scenario\" \u2014 a U.S. export control that cuts allied access to frontier AI \u2014 is the clearest trigger."}];
const OPTIONS     = [{"id": "A1-1", "node_id": "A1", "label": "Single nation", "what_it_means": "One government owns and directs the consortium.", "key_tradeoffs": "Fast decisions and clear accountability, but limited scale and harder regional buy in.", "leads_to": "A2, D1"}, {"id": "A1-2", "node_id": "A1", "label": "Regional bloc", "what_it_means": "A group of allied states co own under a treaty or charter.", "key_tradeoffs": "Pooled compute, capital, and talent, but slower governance and alignment costs.", "leads_to": "A2, A3"}, {"id": "A1-3", "node_id": "A1", "label": "Public institution group", "what_it_means": "National labs, universities, and agencies form the core.", "key_tradeoffs": "Strong research base and neutrality, but weaker commercial muscle.", "leads_to": "B3, E2"}, {"id": "A1-4", "node_id": "A1", "label": "Public and private mix", "what_it_means": "States anchor it with industry as co investors.", "key_tradeoffs": "Capital and speed, but tension over control and profit.", "leads_to": "D1, D3"}, {"id": "A2-1", "node_id": "A2", "label": "Consensus", "what_it_means": "Every member must agree on major moves.", "key_tradeoffs": "Maximum legitimacy, but vulnerable to gridlock and one member stalling.", "leads_to": "A4"}, {"id": "A2-2", "node_id": "A2", "label": "Weighted voting", "what_it_means": "Votes scale with contribution of money, compute, or data.", "key_tradeoffs": "Rewards investment, but can entrench the largest member.", "leads_to": "D1, D3"}, {"id": "A2-3", "node_id": "A2", "label": "Lead member plus board", "what_it_means": "One member steers, advised by the others.", "key_tradeoffs": "Speed and clarity, but risk of smaller members feeling captured.", "leads_to": "A3"}, {"id": "A2-4", "node_id": "A2", "label": "Rotating chair", "what_it_means": "Leadership rotates on a fixed schedule.", "key_tradeoffs": "Shared ownership feeling, but strategy can lurch between terms.", "leads_to": "A4"}, {"id": "A3-1", "node_id": "A3", "label": "Aligned with a bloc", "what_it_means": "Tie supply, standards, and security to one camp.", "key_tradeoffs": "Access to chips and partners, but dependence and reduced autonomy.", "leads_to": "C2, F2"}, {"id": "A3-2", "node_id": "A3", "label": "Nonaligned", "what_it_means": "Stay neutral and trade with multiple sides.", "key_tradeoffs": "Maximum independence, but harder access to leading hardware.", "leads_to": "C2"}, {"id": "A3-3", "node_id": "A3", "label": "Selective bilateral", "what_it_means": "Cut issue by issue deals with several partners.", "key_tradeoffs": "Flexibility, but constant negotiation and exposure to pressure.", "leads_to": "A4, F2"}, {"id": "A4-1", "node_id": "A4", "label": "Strictest member standard", "what_it_means": "Adopt the toughest existing rule among members.", "key_tradeoffs": "High trust and export friendliness, but slower and costlier to ship.", "leads_to": "G2"}, {"id": "A4-2", "node_id": "A4", "label": "New common standard", "what_it_means": "Write a fresh shared framework from scratch.", "key_tradeoffs": "Coherence and ownership, but long to negotiate and ratify.", "leads_to": "G2, G3"}, {"id": "A4-3", "node_id": "A4", "label": "Sector by sector", "what_it_means": "Different rules for health, defense, public services.", "key_tradeoffs": "Pragmatic and fast in low risk areas, but fragmented to manage.", "leads_to": "B3, F1"}, {"id": "B1-1", "node_id": "B1", "label": "Train from scratch", "what_it_means": "Build your own frontier model end to end.", "key_tradeoffs": "Full sovereignty and IP, but enormous cost, talent, and compute demands. The Moonshot path: absorb Mistral/Cohere/CuspAI talent, ~$500B total.", "leads_to": "C1, D1, E1"}, {"id": "B1-2", "node_id": "B1", "label": "Adapt open weights", "what_it_means": "Start from strong open models (e.g., next-gen Mistral, DeepSeek-class).", "key_tradeoffs": "Faster and cheaper, but dependent on upstream releases and licenses. Fast-follower path \u2014 fails under Fable scenario when frontier is locked down.", "leads_to": "B2, G1"}, {"id": "B1-3", "node_id": "B1", "label": "License a closed model", "what_it_means": "Run an Anthropic/OpenAI model inside sovereign infrastructure.", "key_tradeoffs": "Fast capability, but limited control and ongoing vendor dependence. Viable only if the Fable scenario does not materialize.", "leads_to": "F2, G3"}, {"id": "B2-1", "node_id": "B2", "label": "Fully open", "what_it_means": "Release weights publicly for any member or citizen use.", "key_tradeoffs": "Trust, ecosystem growth, and scrutiny, but weaker control over misuse.", "leads_to": "F2, F3"}, {"id": "B2-2", "node_id": "B2", "label": "Open with limits", "what_it_means": "Release under a license that restricts certain uses.", "key_tradeoffs": "Balance of openness and guardrails, but enforcement is hard.", "leads_to": "F2, G2"}, {"id": "B2-3", "node_id": "B2", "label": "Closed", "what_it_means": "Keep weights internal to members and approved partners.", "key_tradeoffs": "Maximum control, but less ecosystem and slower external trust.", "leads_to": "F2"}, {"id": "B3-1", "node_id": "B3", "label": "General platform", "what_it_means": "A broad model and API for many uses.", "key_tradeoffs": "Wide impact, but competes directly with global incumbents.", "leads_to": "B4, D2"}, {"id": "B3-2", "node_id": "B3", "label": "Public sector services", "what_it_means": "Tools for government, courts, health, education.", "key_tradeoffs": "Clear mandate and funding, but procurement and trust hurdles.", "leads_to": "G1, F1"}, {"id": "B3-3", "node_id": "B3", "label": "Strategic sectors", "what_it_means": "Focus on defense, energy, or critical infrastructure.", "key_tradeoffs": "High value and political backing, but heavy security burden.", "leads_to": "F1, F2"}, {"id": "B3-4", "node_id": "B3", "label": "Industry tooling", "what_it_means": "Horizontal tools for member country firms.", "key_tradeoffs": "Economic returns and adoption, but needs commercial polish.", "leads_to": "D2, E1"}, {"id": "B4-1", "node_id": "B4", "label": "Member languages first", "what_it_means": "Prioritize the languages of member populations.", "key_tradeoffs": "Strong local relevance and legitimacy, but smaller data pools.", "leads_to": "G1, E1"}, {"id": "B4-2", "node_id": "B4", "label": "Multilingual from the start", "what_it_means": "Serve many languages at launch.", "key_tradeoffs": "Broad usefulness, but spreads scarce data and evaluation effort.", "leads_to": "C1, D2"}, {"id": "B4-3", "node_id": "B4", "label": "Single common language", "what_it_means": "Build mainly in one shared working language.", "key_tradeoffs": "Simplicity and speed, but weaker on the sovereignty promise.", "leads_to": "B3"}, {"id": "C1-1", "node_id": "C1", "label": "Sovereign datacenters", "what_it_means": "Build and operate facilities on member soil.", "key_tradeoffs": "Full control and data residency. The Moonshot: ~5-6 GW across Norway, France, Iberia, Germany deindustrialized zones. High capital and long lead times.", "leads_to": "C3, D1"}, {"id": "C1-2", "node_id": "C1", "label": "Trusted regional cloud", "what_it_means": "Use vetted providers (e.g., CuspAI or European cloud) within the region.", "key_tradeoffs": "Faster start and lower upfront cost, but reliance on the provider.", "leads_to": "G1, F2"}, {"id": "C1-3", "node_id": "C1", "label": "Hybrid", "what_it_means": "Own core training, rent burst and serving capacity.", "key_tradeoffs": "Balances control and flexibility, but complex to secure and govern.", "leads_to": "C2, F2"}, {"id": "C2-1", "node_id": "C2", "label": "Import under agreements", "what_it_means": "Buy Nvidia Blackwell-class chips through trade and licensing deals.", "key_tradeoffs": "Quick access to leading chips. Nvidia has strong incentive to sell (prefers diverse buyers). Exposed to U.S. export controls.", "leads_to": "A3, F2"}, {"id": "C2-2", "node_id": "C2", "label": "Domestic fabrication", "what_it_means": "Invest in local chip manufacturing (e.g., TSMC partnership, Samsung Foundry).", "key_tradeoffs": "Long term independence, but very costly and slow to mature. 15+ year timeline for full capacity.", "leads_to": "D1, E1"}, {"id": "C2-3", "node_id": "C2", "label": "Mixed with reserves", "what_it_means": "Import now (Nvidia) while building ASML-leveraged coercion shield.", "key_tradeoffs": "Resilience against shocks. The Moonshot: use ASML EUV access as anti-coercion instrument against U.S. export controls.", "leads_to": "D1, C3"}, {"id": "C3-1", "node_id": "C3", "label": "Dedicated generation", "what_it_means": "Build or contract power directly for the clusters.", "key_tradeoffs": "Reliable and controllable, but adds a major project to manage.", "leads_to": "D1"}, {"id": "C3-2", "node_id": "C3", "label": "Priority grid access", "what_it_means": "Secure guaranteed capacity from the public grid.", "key_tradeoffs": "Lower build burden, but exposed to grid stress and policy shifts.", "leads_to": "D1"}, {"id": "C3-3", "node_id": "C3", "label": "Locate near power", "what_it_means": "Site clusters where energy is cheap and abundant (Norway hydro, France nuclear, Iberia solar).", "key_tradeoffs": "Low cost and clean options. Germany built LNG terminals in 10 months in 2022 \u2014 precedent for crisis-speed infrastructure.", "leads_to": "C1, G1"}, {"id": "D1-1", "node_id": "D1", "label": "Government appropriations", "what_it_means": "Member treasuries fund the program directly.", "key_tradeoffs": "Stable and mission aligned, but exposed to budget and election cycles.", "leads_to": "D2"}, {"id": "D1-2", "node_id": "D1", "label": "Sovereign and development funds", "what_it_means": "Wealth funds or development banks invest.", "key_tradeoffs": "Patient large capital, but expects governance and return discipline.", "leads_to": "D3"}, {"id": "D1-3", "node_id": "D1", "label": "Private investment with states", "what_it_means": "Industry invests alongside member governments.", "key_tradeoffs": "Speed and scale, but pressure for commercial returns and control. Crowd in legacy industries with deep cash reserves.", "leads_to": "A1, D3"}, {"id": "D1-4", "node_id": "D1", "label": "Mixed", "what_it_means": "Blend public anchor with private investment and grants.", "key_tradeoffs": "The Moonshot total: ~$500B \u2014 compute ($275-300B), talent ($65B), political insulation ($80B), interim rental ($25B). Diversified but complex.", "leads_to": "D2, D3"}, {"id": "D2-1", "node_id": "D2", "label": "Public good", "what_it_means": "Funded by states, free at the point of use.", "key_tradeoffs": "Maximum access and trust, but permanently dependent on budgets.", "leads_to": "G3"}, {"id": "D2-2", "node_id": "D2", "label": "Commercial licensing", "what_it_means": "Charge firms and partners for access.", "key_tradeoffs": "Self sustaining over time. Partial privatization (Airbus model) can return capital to treasuries. But pulls focus toward paying customers.", "leads_to": "B3, D3"}, {"id": "D2-3", "node_id": "D2", "label": "Tiered", "what_it_means": "Free public tier, paid commercial tier.", "key_tradeoffs": "Balances mission and revenue, but needs careful boundary setting.", "leads_to": "B3, G2"}, {"id": "D3-1", "node_id": "D3", "label": "Held by the consortium", "what_it_means": "A central legal entity owns the IP.", "key_tradeoffs": "Coherent and easy to license, but members may resist pooling.", "leads_to": "G3"}, {"id": "D3-2", "node_id": "D3", "label": "Shared by members", "what_it_means": "Members co own with agreed usage rights.", "key_tradeoffs": "Fair and politically palatable, but slow and litigious to manage.", "leads_to": "A2, G3"}, {"id": "D3-3", "node_id": "D3", "label": "Open licensed", "what_it_means": "Release IP under open terms by default.", "key_tradeoffs": "Trust and ecosystem, but forgoes a major revenue lever.", "leads_to": "B2, D2"}, {"id": "E1-1", "node_id": "E1", "label": "Repatriate diaspora", "what_it_means": "Recruit nationals working abroad to return.", "key_tradeoffs": "Aligned and loyal talent. Middle power nationals at American labs (Anthropic, OpenAI, DeepMind) are the primary pool. Limited and contested.", "leads_to": "E2"}, {"id": "E1-2", "node_id": "E1", "label": "Recruit globally", "what_it_means": "Hire the best regardless of nationality.", "key_tradeoffs": "Top capability quickly, but visa, security, and trust questions. The Moonshot: ~150 senior researchers at $5-8M/year each, plus buying out unvested frontier-lab equity (~$10B).", "leads_to": "F2, F3"}, {"id": "E1-3", "node_id": "E1", "label": "Train domestically", "what_it_means": "Invest in universities and fellowships at home.", "key_tradeoffs": "Durable long term pipeline, but slow to produce frontier talent.", "leads_to": "E2, D1"}, {"id": "E2-1", "node_id": "E2", "label": "Central lab", "what_it_means": "One flagship lab concentrates the work.", "key_tradeoffs": "Focus and speed, but other members may feel sidelined.", "leads_to": "C1"}, {"id": "E2-2", "node_id": "E2", "label": "Federated labs", "what_it_means": "Each member runs a node in a shared program.", "key_tradeoffs": "Broad buy in and local capacity, but coordination overhead.", "leads_to": "A2, F3"}, {"id": "E2-3", "node_id": "E2", "label": "University partnerships", "what_it_means": "Anchor research in academic institutions.", "key_tradeoffs": "Talent pipeline and openness, but slower translation to product.", "leads_to": "B3"}, {"id": "F1-1", "node_id": "F1", "label": "Independent body", "what_it_means": "An arm length safety authority \u2014 modeled on the UK AI Safety Institute.", "key_tradeoffs": "Credibility and trust. The Moonshot: country-level czars at ministerial rank with high-caliber policy teams as government liaisons.", "leads_to": "F3, A4"}, {"id": "F1-2", "node_id": "F1", "label": "Internal team", "what_it_means": "Safety sits inside the build organization.", "key_tradeoffs": "Fast and informed, but vulnerable to pressure to ship.", "leads_to": "F3"}, {"id": "F1-3", "node_id": "F1", "label": "Shared with regulators", "what_it_means": "Co govern with member country regulators.", "key_tradeoffs": "Strong legitimacy, but exposed to differing national rules.", "leads_to": "G2, A4"}, {"id": "F2-1", "node_id": "F2", "label": "Members only", "what_it_means": "Access limited to member states and vetted users.", "key_tradeoffs": "Tight control, but limits reach and economic return.", "leads_to": "B2, D2"}, {"id": "F2-2", "node_id": "F2", "label": "Tiered access", "what_it_means": "Different capability levels for different users.", "key_tradeoffs": "Flexible and risk aware, but complex to define and police.", "leads_to": "G2"}, {"id": "F2-3", "node_id": "F2", "label": "Open with monitoring", "what_it_means": "Broad access with usage logging and review.", "key_tradeoffs": "Reach and openness, but heavy monitoring burden and privacy tension.", "leads_to": "G1, G2"}, {"id": "F3-1", "node_id": "F3", "label": "Centralized response", "what_it_means": "One team owns detection and response.", "key_tradeoffs": "Consistent and fast, but a single point of overload.", "leads_to": "F1"}, {"id": "F3-2", "node_id": "F3", "label": "Member level response", "what_it_means": "Each member handles incidents locally.", "key_tradeoffs": "Local context and speed, but uneven standards and gaps.", "leads_to": "A2"}, {"id": "F3-3", "node_id": "F3", "label": "Shared protocol", "what_it_means": "Common playbook executed by all members.", "key_tradeoffs": "Coordinated and scalable, but requires constant joint drilling.", "leads_to": "F1, A2"}, {"id": "G1-1", "node_id": "G1", "label": "Strictly in region", "what_it_means": "All data stays within member borders.", "key_tradeoffs": "Strong sovereignty claim, but limits cloud and partner options.", "leads_to": "C1, C3"}, {"id": "G1-2", "node_id": "G1", "label": "Federated with localization", "what_it_means": "Data stays local but is queried across nodes.", "key_tradeoffs": "Balance of sovereignty and scale, but complex to engineer.", "leads_to": "C1, F2"}, {"id": "G1-3", "node_id": "G1", "label": "Cross border under treaty", "what_it_means": "Data moves under agreed legal protections.", "key_tradeoffs": "Flexibility and scale, but depends on durable agreements.", "leads_to": "A3, G2"}, {"id": "G2-1", "node_id": "G2", "label": "Strictest member law", "what_it_means": "Apply the toughest member standard everywhere (GDPR baseline).", "key_tradeoffs": "High trust and portability, but the most restrictive on data use.", "leads_to": "B1, A4"}, {"id": "G2-2", "node_id": "G2", "label": "New common framework", "what_it_means": "Draft a shared rights regime for the consortium.", "key_tradeoffs": "Coherence and clarity, but slow and politically heavy.", "leads_to": "A4, G3"}, {"id": "G2-3", "node_id": "G2", "label": "Sector specific", "what_it_means": "Tailor consent rules to each domain.", "key_tradeoffs": "Practical and proportionate, but fragmented and harder to audit.", "leads_to": "B3, F1"}, {"id": "G3-1", "node_id": "G3", "label": "Consortium bears", "what_it_means": "The central entity is liable.", "key_tradeoffs": "Clear for users and partners, but concentrates risk and cost.", "leads_to": "D3"}, {"id": "G3-2", "node_id": "G3", "label": "Members bear", "what_it_means": "Each member is liable for its own use.", "key_tradeoffs": "Aligns risk with control, but creates uneven exposure.", "leads_to": "A2"}, {"id": "G3-3", "node_id": "G3", "label": "Shared", "what_it_means": "Liability is apportioned by an agreed formula.", "key_tradeoffs": "Fair in principle, but disputes are likely and slow to settle.", "leads_to": "A2, D3"}, {"id": "H1-1", "node_id": "H1", "label": "Airbus Model", "what_it_means": "State-backed consortium with shared public ownership, built to reach commercial viability. Governments absorb early risk; partial privatization returns capital. The Moonshot: EU+Canada+Australia core, ~$500B over four years.", "key_tradeoffs": "Best chance at frontier parity and commercial sustainability. Requires extraordinary political will and a coercion shield against U.S. chip export controls.", "leads_to": "A1, D1, E1"}, {"id": "H1-2", "node_id": "H1", "label": "CERN Model", "what_it_means": "Pure public-good research consortium. Members fund in proportion to GDP; outputs are open to all. Rotating scientific leadership. No commercial products.", "key_tradeoffs": "High legitimacy and easy to defend politically. Does not produce a deployable product competitive with U.S. or Chinese frontier models. Fails the sovereignty test under Fable scenario.", "leads_to": "B2, D2"}, {"id": "H1-3", "node_id": "H1", "label": "National Champion", "what_it_means": "One country leads; others participate as junior partners. France+Mistral is the current attempt. UK could lead with CuspAI/DeepMind talent. The lead nation absorbs political and financial risk.", "key_tradeoffs": "Faster to launch and easier to govern. Structural dependency on the lead nation \u2014 if it defects or its policy changes, the project collapses.", "leads_to": "A1-1, D1"}, {"id": "H1-4", "node_id": "H1", "label": "Fast-Follower Alliance", "what_it_means": "No attempt at the frontier. Standardizes on a second-tier open-weight model (next-generation Mistral, DeepSeek-class), deploys across member governments, negotiates sovereign terms with U.S. labs.", "key_tradeoffs": "Far cheaper and faster to implement. Does not solve the access problem under Fable scenario. Works as a hedge, not a sovereign strategy. Increasingly unviable as frontier/second-best gap widens.", "leads_to": "B1-2, F2"}, {"id": "H1-5", "node_id": "H1", "label": "Managed Dependency", "what_it_means": "No autonomous model. Negotiates legally binding access agreements with U.S. providers (Anthropic, OpenAI, Google DeepMind), possibly backed by infrastructure investment or equity co-ownership.", "key_tradeoffs": "Lowest cost. Fails under the specific Fable scenario: a maximally volatile U.S. executive that ignores interdependence. Works only if the worst-case U.S. scenario does not materialize.", "leads_to": "A3, F2"}, {"id": "H2-1", "node_id": "H2", "label": "Mistral (France)", "what_it_means": "Europe's highest-profile frontier-adjacent lab. Open-weight models competitive below the frontier. EU institutional backing, French government support, commercial traction.", "key_tradeoffs": "Real talent, real models, real infrastructure relationships. Not at the frontier. The Moonshot: useful as talent pool and base layer to absorb into the larger project, not as organizing entity.", "leads_to": "E1, B1"}, {"id": "H2-2", "node_id": "H2", "label": "Cohere / Aleph Alpha (Canada/Germany)", "what_it_means": "Enterprise AI labs with government ties. Cohere focuses on enterprise APIs; Aleph Alpha has German federal contracts. Below the frontier but original research and government credibility.", "key_tradeoffs": "Valuable for government deployment relationships and multilingual capabilities. Flagged as structurally insufficient models for the sovereign project \u2014 have not achieved frontier parity.", "leads_to": "B3, E1"}, {"id": "H2-3", "node_id": "H2", "label": "CuspAI (UK)", "what_it_means": "UK-based AI compute and infrastructure company focused on sovereign AI capability. Positioned at the intersection of government security requirements and frontier AI deployment.", "key_tradeoffs": "Strong alignment with consortium security and sovereignty goals. UK political uncertainty about joining a non-U.S.-aligned project is the main risk.", "leads_to": "C1, F1"}, {"id": "H2-4", "node_id": "H2", "label": "ASML and European Semiconductor Leverage", "what_it_means": "ASML (Netherlands) produces the EUV lithography machines without which no one can manufacture leading-edge chips. Europe's most powerful AI leverage point.", "key_tradeoffs": "The Moonshot's coercion shield: if U.S. attempts to block chip exports, coalition can threaten EUV access. This turns ASML from a passive asset into an active diplomatic instrument. Politically sensitive and a one-shot card.", "leads_to": "C2, A3"}, {"id": "H3-1", "node_id": "H3", "label": "Nvidia", "what_it_means": "Dominant supplier of AI accelerators (H100, B200, Blackwell). The Moonshot: ~3M Blackwell-class chips needed, ~$275-300B total. Nvidia prefers diverse buyers over U.S. monopsony \u2014 can be a U.S.-internal advocate for allowing sales.", "key_tradeoffs": "Critical path dependency. U.S. export controls could restrict sales. Nvidia's commercial interests make it a potential ally. The consortium should court Nvidia, not just pay it.", "leads_to": "C2, A3"}, {"id": "H3-2", "node_id": "H3", "label": "AWS / Azure / Google Cloud", "what_it_means": "U.S. hyperscalers currently provide most compute for non-frontier AI in middle powers. Trusted regional cloud (C1-2) would route through one of these with negotiated data residency and sovereignty terms.", "key_tradeoffs": "Fast to deploy, well-understood operationally. Politically and legally complex \u2014 data residency commitments can be reversed, subject to U.S. jurisdiction, access can be revoked under Fable-type scenarios.", "leads_to": "C1, G1"}, {"id": "H3-3", "node_id": "H3", "label": "TSMC / Samsung Foundry", "what_it_means": "Taiwan and South Korea produce the chips Nvidia designs. Domestic fabrication (C2-2) requires partnering with or competing against these foundries, or building a new fab (15+ year timeline).", "key_tradeoffs": "Long-term chip independence requires foundry access or ownership. TSMC's geopolitical position (Taiwan Strait risk) is itself a sovereignty concern.", "leads_to": "C2, A1"}, {"id": "H4-1", "node_id": "H4", "label": "Anthropic", "what_it_means": "Frontier lab with the strongest safety focus. Has limited model access for competing frontier AI development. The Fable scenario references Anthropic's Fable 5 being shut down by U.S. export controls \u2014 directly inspiring this decision tree.", "key_tradeoffs": "Potential partner on safety standards. Active antagonist if the consortium's goal is frontier parity \u2014 Anthropic has explicit policy against helping build competing frontier systems.", "leads_to": "F1, A3"}, {"id": "H4-2", "node_id": "H4", "label": "OpenAI", "what_it_means": "Dominant model provider with the broadest API access. The Moonshot suggests OpenAI may sell coding agent contracts to the consortium in early stages, positioning itself as less restrictive than Anthropic.", "key_tradeoffs": "Useful for bootstrapping the consortium's AI workforce before a sovereign model exists. Long-term dependence on OpenAI reproduces the problem the consortium is trying to solve.", "leads_to": "E1, B1"}, {"id": "H4-3", "node_id": "H4", "label": "xAI / Grok", "what_it_means": "Elon Musk's AI lab. Now renting compute to Anthropic, suggesting financial stress at the second tier. Potentially willing to sell compute at favorable terms to the consortium.", "key_tradeoffs": "Geopolitically complex given Musk's relationship with U.S. government. Some consortium members' domestic politics would make the association controversial.", "leads_to": "C1, A3"}, {"id": "H4-4", "node_id": "H4", "label": "Google DeepMind", "what_it_means": "UK-headquartered but U.S.-controlled. Has the deepest scientific talent and longest research track record. UK government relationships may create a special channel for the consortium.", "key_tradeoffs": "UK DeepMind staff represent a potential talent recruitment pool, especially given growing concerns about commercialization pressure. Parent company U.S. jurisdiction remains the binding constraint.", "leads_to": "E1, F1"}, {"id": "H5-1", "node_id": "H5", "label": "The Fable Scenario", "what_it_means": "A U.S. executive action shuts down or restricts a frontier AI model as domestic policy, with allied access cut as collateral damage. The clearest trigger for coalition formation. Named after Anthropic's Fable 5 model.", "key_tradeoffs": "Makes the case for the sovereign project more compelling than any policy paper. Also creates a political window for rapid coalition formation. Risk: may come too late, after the U.S. frontier has pulled too far ahead.", "leads_to": "A1, A3, D1"}, {"id": "H5-2", "node_id": "H5", "label": "Gradual Access Tiering", "what_it_means": "The U.S. establishes a country-tier system for AI inference access. Europe 2031 scenario: most of Europe lands in Tier 2 with compute allocations halved as the U.S. faces compute scarcity.", "key_tradeoffs": "Less politically dramatic but more economically damaging. Creates sustained pressure without a single crisis moment. The consortium's case is harder to make, but the underlying need is the same.", "leads_to": "A3, C2, D1"}, {"id": "H5-3", "node_id": "H5", "label": "Semiconductor Coercion", "what_it_means": "The U.S. pressures the Netherlands to cut ASML exports (to China or the consortium). Europe 2031: the Netherlands caves without EU support \u2014 the consortium structure prevents this through collective commitment.", "key_tradeoffs": "The ASML leverage is a finite card. Once spent protecting one bilateral relationship, it is no longer available. The consortium structure is specifically designed to pool this leverage.", "leads_to": "C2, A3, A1"}, {"id": "H5-4", "node_id": "H5", "label": "Chinese Competitive Pressure", "what_it_means": "China's AI development forces a security framing even absent U.S. restrictions. DeepSeek/Kimi as the Chinese alternative \u2014 choosing not to build sovereign AI means choosing between U.S. and Chinese dependence.", "key_tradeoffs": "China's open-source releases (DeepSeek R1) temporarily cheapen fast-follower AI but also spread offensive capabilities. The consortium offers a third option: non-Chinese, non-U.S. frontier AI.", "leads_to": "A3, B1, F2"}];
const CRIT_PATH   = [{"step": 1, "node_id": "A1", "title": "Control", "description": "Decide who owns and directs the consortium before anything else. The Airbus Model (H1-1) requires multi-government co-ownership; the National Champion (H1-3) requires one lead nation."}, {"step": 2, "node_id": "A2", "title": "Decision rule", "description": "Agree how members break ties. The Moonshot flags defection risk \u2014 weighted voting with precommitted resources is the strongest defense against bilateral U.S. buyouts of individual members."}, {"step": 3, "node_id": "A3", "title": "Geopolitical posture", "description": "Your alignment determines whether you can buy the chips your product plans assume. A nonaligned stance paired with ASML leverage (H2-4, H3-1) is The Moonshot coercion shield strategy."}, {"step": 4, "node_id": "B1", "title": "Foundation model approach", "description": "The Moonshot is explicit: only training from scratch (absorbing talent from Mistral, Cohere, CuspAI) achieves genuine sovereignty. Fast-follower (H1-4) fails under the Fable scenario when the frontier is locked down."}, {"step": 5, "node_id": "C1, C2", "title": "Compute location and chips", "description": "The Moonshot estimate: ~3M Blackwell-class chips (Nvidia), 5-6 GW of datacenter power, ~$275-300B. ASML (H2-4) is the coercion shield. Norway, France, Iberia, and Germany are the preferred datacenter hosts."}, {"step": 6, "node_id": "D1", "title": "Capital source", "description": "The Moonshot total: ~$500B over four years \u2014 compute ($275-300B), talent ($65B), political insulation ($80B), interim compute rental ($25B). Requires treasury-level commitment from multiple coalition governments."}, {"step": 7, "node_id": "G1, G2", "title": "Data residency and rights", "description": "Lock these before training. European member states bring GDPR frameworks; the new common standard approach (G2-2) creates coherence but requires treaty-level negotiation."}, {"step": 8, "node_id": "F1", "title": "Safety governance", "description": "Stand up oversight early. The Moonshot recommends country-level czars at ministerial rank with high-caliber policy teams \u2014 modeled on the UK AI Safety Institute \u2014 as government liaisons to the technical organization."}];
const BCOLORS     = {"A": "#1a3a5c", "B": "#1b5e20", "C": "#e65100", "D": "#4a148c", "E": "#006064", "F": "#b71c1c", "G": "#004d40", "H": "#37474f"};

// ── state ─────────────────────────────────────────────────────────────────
let network, allNodes, allEdges;
let activeBranch = null;

// ── init ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildBranchPills();
  buildLegend();
  buildGraph();
  buildListView();
});

// ── branch pills ──────────────────────────────────────────────────────────
function buildBranchPills() {
  const c = document.getElementById('branch-pills');
  // All pill
  const all = pill('All', null, true);
  c.appendChild(all);
  BRANCHES.forEach(b => c.appendChild(pill(b.id + ' — ' + b.name, b.id)));
  c.appendChild(pill('Critical Path', '__cp__'));
}

function pill(label, id, active) {
  const btn = document.createElement('button');
  btn.className = 'pill' + (active ? ' active' : '');
  btn.textContent = label;
  if (id !== '__cp__') {
    btn.style.setProperty('--pc', BCOLORS[id] || '#555');
    if (active) { btn.style.background = '#334155'; }
  }
  btn.onclick = () => filterBranch(id);
  return btn;
}

function filterBranch(id) {
  activeBranch = id;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.pill').forEach(p => {
    const matches =
      (id === null && p.textContent === 'All') ||
      (id !== null && p.textContent.startsWith(id + ' ')) ||
      (id === '__cp__' && p.textContent === 'Critical Path');
    if (matches) {
      p.classList.add('active');
      if (id && id !== '__cp__' && BCOLORS[id]) p.style.background = BCOLORS[id];
      else p.style.background = '#334155';
    }
  });
  if (id === '__cp__') { showCriticalPathDetail(); return; }
  applyFilter();
}

// ── graph ─────────────────────────────────────────────────────────────────
function buildGraph() {
  const nodes = [], edges = [];

  NODES.forEach(n => {
    const col = BCOLORS[n.branch_id] || '#555';
    const opts = OPTIONS.filter(o => o.node_id === n.id);
    nodes.push({
      id: n.id,
      label: n.id + '\n' + wrapText(n.question, 22),
      title: '<b>' + n.id + '</b>: ' + n.question,
      color: { background: col, border: col,
                highlight: { background: lighten(col), border: '#fff' },
                hover: { background: lighten(col), border: col } },
      font: { color: '#fff', size: 12, face: '-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif' },
      shape: 'box',
      margin: 10,
      widthConstraint: { minimum: 120, maximum: 160 },
      shadow: true,
      borderWidth: 2,
      borderWidthSelected: 3,
    });

    // Edges from leads_to
    opts.forEach(opt => {
      opt.leads_to.split(/[,;]/).forEach(raw => {
        const target = raw.trim();
        if (!target) return;
        const exists = NODES.find(x => x.id === target);
        if (!exists) return;
        edges.push({
          from: n.id,
          to: target,
          label: opt.label.length > 18 ? opt.label.slice(0,16)+'…' : opt.label,
          font: { size: 10, color: '#555', align: 'middle' },
          color: { color: '#cbd5e1', highlight: '#2d7dd2', hover: '#2d7dd2' },
          arrows: { to: { enabled: true, scaleFactor: 0.7 } },
          smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: 0.4 },
          width: 1.5,
        });
      });
    });
  });

  allNodes = new vis.DataSet(nodes);
  allEdges = new vis.DataSet(edges);

  network = new vis.Network(
    document.getElementById('network'),
    { nodes: allNodes, edges: allEdges },
    {
      layout: {
        hierarchical: {
          enabled: true,
          direction: 'LR',
          sortMethod: 'directed',
          levelSeparation: 220,
          nodeSpacing: 90,
          treeSpacing: 160,
        }
      },
      physics: { enabled: false },
      interaction: {
        hover: true,
        tooltipDelay: 200,
        navigationButtons: true,
        keyboard: true,
        zoomView: true,
        dragView: true,
      },
      nodes: {
        borderWidth: 2,
        shadow: true,
      },
    }
  );

  network.on('click', params => {
    if (params.nodes.length > 0) showNodeDetail(params.nodes[0]);
  });
}

function applyFilter() {
  if (!allNodes) return;
  const branch = activeBranch;
  if (branch === null) {
    allNodes.forEach(n => allNodes.update({ id: n.id, hidden: false }));
    allEdges.forEach(e => allEdges.update({ id: e.id, hidden: false }));
  } else {
    const visible = new Set(NODES.filter(n => n.branch_id === branch).map(n => n.id));
    // also show immediate neighbors
    allEdges.forEach(e => {
      if (visible.has(e.from)) visible.add(e.to);
    });
    allNodes.forEach(n => allNodes.update({ id: n.id, hidden: !visible.has(n.id) }));
    allEdges.forEach(e => allEdges.update({ id: e.id, hidden: !(visible.has(e.from) && visible.has(e.to)) }));
    network.fit({ nodes: [...visible], animation: true });
  }
}

// ── detail panel ──────────────────────────────────────────────────────────
function showNodeDetail(nodeId) {
  const node = NODES.find(n => n.id === nodeId);
  if (!node) return;
  const opts = OPTIONS.filter(o => o.node_id === nodeId);
  const col  = BCOLORS[node.branch_id] || '#555';
  const b    = BRANCHES.find(x => x.id === node.branch_id);

  let html = `
    <div style="border-bottom:3px solid ${col};padding-bottom:14px;margin-bottom:16px">
      <div class="detail-branch-id" style="color:${col}">Branch ${node.branch_id} — ${b ? b.name : ''}</div>
      <div class="detail-question">${node.question}</div>
      <div class="detail-desc">${node.description}</div>
    </div>
    <div class="detail-section-title">Options</div>
  `;
  opts.forEach(o => {
    const chips = o.leads_to.split(/[,;]/).map(t => t.trim()).filter(Boolean)
      .map(t => `<span class="node-chip" onclick="highlightAndGo('${t}')">${t}</span>`).join('');
    html += `
      <div class="option-card">
        <div class="option-label">${o.label}</div>
        <div class="option-means">${o.what_it_means}</div>
        <div class="option-trades">${o.key_tradeoffs}</div>
        ${chips ? '<div class="leads-wrap">' + chips + '</div>' : ''}
      </div>
    `;
  });

  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-panel').classList.remove('hidden');
  document.getElementById('graph-panel').style.flex = '1';
}

function showCriticalPathDetail() {
  let html = `<div class="detail-branch-id" style="color:var(--accent)">Critical Path</div>
    <div class="detail-question">Resolve these decisions first</div>
    <div class="detail-desc">Each one gates the choices after it. Reversing them later is expensive.</div>
    <div style="margin-top:16px">`;
  CRIT_PATH.forEach(cp => {
    html += `<div class="cp-item">
      <div class="cp-num">${cp.step}</div>
      <div>
        <div><span class="cp-nid" style="cursor:pointer" onclick="highlightAndGo('${cp.node_id.split(',')[0].trim()}')">${cp.node_id}</span>
        <span class="cp-title">${cp.title}</span></div>
        <div class="cp-desc">${cp.description}</div>
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-panel').classList.remove('hidden');
  document.getElementById('graph-panel').style.flex = '1';
}

function closeDetail() {
  document.getElementById('detail-panel').classList.add('hidden');
  network && network.unselectAll();
}

function highlightAndGo(nodeId) {
  if (!network) return;
  const node = NODES.find(n => n.id === nodeId);
  if (node && activeBranch !== node.branch_id) {
    filterBranch(node.branch_id);
  }
  setTimeout(() => {
    network.focus(nodeId, { scale: 1.2, animation: true });
    network.selectNodes([nodeId]);
    showNodeDetail(nodeId);
  }, 200);
}

// ── search ────────────────────────────────────────────────────────────────
function searchNodes(query) {
  if (!allNodes || !query) {
    applyFilter();
    return;
  }
  const q = query.toLowerCase();
  const matched = new Set(
    NODES.filter(n =>
      n.id.toLowerCase().includes(q) ||
      n.question.toLowerCase().includes(q) ||
      n.description.toLowerCase().includes(q) ||
      OPTIONS.filter(o => o.node_id === n.id).some(o =>
        o.label.toLowerCase().includes(q) || o.what_it_means.toLowerCase().includes(q)
      )
    ).map(n => n.id)
  );
  allNodes.forEach(n => allNodes.update({ id: n.id, hidden: !matched.has(n.id) }));
  allEdges.forEach(e => allEdges.update({ id: e.id, hidden: !(matched.has(e.from) && matched.has(e.to)) }));
  if (matched.size > 0) network.fit({ nodes: [...matched], animation: true });
}

// ── list view ─────────────────────────────────────────────────────────────
function buildListView() {
  const panel = document.getElementById('list-panel');

  // Critical path card
  let cpHtml = `<div class="cp-section"><h2>Critical Path Summary</h2>
    <p>Resolve these in order. Each one gates the choices after it.</p>`;
  CRIT_PATH.forEach(cp => {
    cpHtml += `<div class="cp-item">
      <div class="cp-num">${cp.step}</div>
      <div><div><span class="cp-nid">${cp.node_id}</span><span class="cp-title">${cp.title}</span></div>
      <div class="cp-desc">${cp.description}</div></div>
    </div>`;
  });
  cpHtml += '</div>';
  panel.innerHTML = cpHtml;

  BRANCHES.forEach(branch => {
    const col = BCOLORS[branch.id] || '#555';
    const branchNodes = NODES.filter(n => n.branch_id === branch.id);
    let nodeHtml = '';
    branchNodes.forEach(node => {
      const opts = OPTIONS.filter(o => o.node_id === node.id);
      let rows = opts.map(o => `<tr>
        <td><b>${o.label}</b></td>
        <td>${o.what_it_means}</td>
        <td style="color:var(--muted);font-style:italic">${o.key_tradeoffs}</td>
        <td>${o.leads_to.split(/[,;]/).map(t => t.trim()).filter(Boolean)
          .map(t => `<span style="background:#e8f0fe;color:#1a56db;font-size:10px;font-weight:600;padding:2px 6px;border-radius:10px;margin-right:4px">${t}</span>`).join('')}</td>
      </tr>`).join('');
      nodeHtml += `<div class="node-row">
        <div class="node-row-q">${node.id}. ${node.question}</div>
        <div class="node-row-d">${node.description}</div>
        ${opts.length ? `<table class="opt-tbl">
          <thead><tr><th>Option</th><th>What it means</th><th>Key tradeoffs</th><th>Leads to</th></tr></thead>
          <tbody>${rows}</tbody></table>` : ''}
      </div>`;
    });

    const div = document.createElement('div');
    div.className = 'branch-block';
    div.innerHTML = `
      <div class="branch-hdr" onclick="toggleBranch(this)">
        <span class="branch-hdr-id" style="background:${col}">${branch.id}</span>
        <span class="branch-hdr-name">${branch.name}</span>
        <span class="branch-hdr-arrow">›</span>
      </div>
      <div class="branch-body">
        <div class="branch-desc">${branch.description}</div>
        ${nodeHtml}
      </div>
    `;
    panel.appendChild(div);
  });
}

function toggleBranch(hdr) {
  hdr.classList.toggle('open');
  hdr.nextElementSibling.classList.toggle('open');
}

// ── view toggle ───────────────────────────────────────────────────────────
function setView(v) {
  const gp = document.getElementById('graph-panel');
  const lp = document.getElementById('list-panel');
  document.getElementById('btn-graph').classList.toggle('active', v === 'graph');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
  if (v === 'graph') {
    gp.style.display = '';
    lp.classList.remove('active');
  } else {
    gp.style.display = 'none';
    lp.classList.add('active');
    document.getElementById('detail-panel').classList.add('hidden');
  }
}

// ── legend ────────────────────────────────────────────────────────────────
function buildLegend() {
  const c = document.getElementById('legend-items');
  BRANCHES.forEach(b => {
    const col = BCOLORS[b.id] || '#555';
    c.innerHTML += `<div class="legend-item">
      <div class="legend-dot" style="background:${col}"></div>
      <span style="color:#334155"><b>${b.id}</b> ${b.name}</span>
    </div>`;
  });
}

// ── utilities ─────────────────────────────────────────────────────────────
function wrapText(text, maxLen) {
  if (text.length <= maxLen) return text;
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w => {
    if ((line + ' ' + w).trim().length <= maxLen) {
      line = (line + ' ' + w).trim();
    } else {
      if (line) lines.push(line);
      line = w;
    }
  });
  if (line) lines.push(line);
  return lines.slice(0,3).join('\n') + (lines.length > 3 ? '…' : '');
}

function lighten(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lf = 0.25;
  const lr = Math.round(r + (255-r)*lf), lg = Math.round(g + (255-g)*lf), lb = Math.round(b + (255-b)*lf);
  return '#' + [lr,lg,lb].map(v => v.toString(16).padStart(2,'0')).join('');
}
